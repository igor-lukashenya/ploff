# moon workspace configuration - https://moonrepo.dev/docs/config/workspace
# See docs/adr/003-monorepo-tooling.md for why moon is used.
$schema: 'https://moonrepo.dev/schemas/workspace.json'

# Every folder in apps/ and packages/ with a moon.yml is a project.
# The folder name is the project ID (e.g. apps/sample-api -> sample-api).
projects:
  globs:
    - 'apps/*/moon.yml'
    - 'packages/*/moon.yml'

vcs:
  client: 'git'
  provider: 'github'
  defaultBranch: 'main'
  # Git hooks, installed by `make setup` (moon sync hooks). Kept fast on purpose:
  # full lint/test runs in CI. Skip once with `git commit --no-verify`.
  hooks:
    pre-commit:
      # Secrets in staged changes (skipped with a hint if gitleaks isn't installed)
      - 'bash tools/scripts/scan-security.sh secrets --staged'
    commit-msg:
      # Release Please needs Conventional Commits
      - 'bash tools/scripts/check-conventional.sh --file $ARG1'

# Apps may depend on libraries, never on other apps (see apps/README.md).
constraints:
  enforceLayerRelationships: true

# Scaffolding templates used by `make new-app` / `make new-package`.
generator:
  templates:
    - './tools/generators'

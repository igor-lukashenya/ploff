# Standard tasks for Node.js / TypeScript projects (moon.yml with
# `language: 'typescript'` or `'javascript'`). Tasks call package.json scripts,
# so every JS project must define: lint, lint:fix, type-check, test, build, dev.
$schema: 'https://moonrepo.dev/schemas/tasks.json'

inheritedBy:
  languages: ['typescript', 'javascript']

fileGroups:
  sources:
    - 'src/**/*'
    - 'public/**/*'
    - 'index.html'
    - 'package.json'
    - 'package-lock.json'
    - 'tsconfig*.json'
    - '*.config.*'
    - '/.editorconfig'

tasks:
  lint:
    description: 'Lint sources'
    command: 'npm run lint'
    inputs:
      - '@group(sources)'

  typecheck:
    description: 'Type-check all TypeScript configs'
    command: 'npm run type-check'
    inputs:
      - '@group(sources)'

  test:
    description: 'Run unit tests'
    command: 'npm test'
    inputs:
      - '@group(sources)'

  build:
    description: 'Production build into dist/'
    command: 'npm run build'
    deps:
      # Build dependencies (shared packages in dependsOn) first; also makes CI
      # re-run this project's tasks when a dependency changes
      - '^:build'
    inputs:
      - '@group(sources)'
    outputs:
      - 'dist'

  publish:
    description: 'Produce the deployable artifact in dist/'
    deps:
      - '~:build'

  format:
    description: 'Apply lint fixes'
    command: 'npm run lint:fix'
    options:
      cache: false
      runInCI: false

  dev:
    description: 'Start the dev server'
    command: 'npm run dev'
    preset: 'server'

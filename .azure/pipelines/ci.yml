# Azure DevOps — CI Pipeline
#
# Runs on every push and pull request to main/develop.
# Builds and tests all applications in the monorepo.
#
# TODO: Customize for your specific apps and tech stack.
# Docs: https://learn.microsoft.com/en-us/azure/devops/pipelines/

trigger:
  branches:
    include:
      - main
      - develop

pr:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: 'ubuntu-latest'

variables:
  CI: 'true'
  # TODO: Add project-specific variables

stages:
  # ─── Lint Stage ──────────────────────────────────────────────────────────
  - stage: Lint
    displayName: 'Lint'
    jobs:
      - job: Lint
        displayName: 'Check Formatting'
        steps:
          - checkout: self

          - task: UseDotNet@2
            inputs:
              useGlobalJson: true

          - script: dotnet restore apps/sample-api/SampleApi.sln
            displayName: 'Restore'

          - script: dotnet format apps/sample-api/SampleApi.sln --verify-no-changes
            displayName: 'Check formatting'

  # ─── Test Stage ──────────────────────────────────────────────────────────
  - stage: Test
    displayName: 'Test'
    dependsOn: Lint
    jobs:
      - job: Test
        displayName: 'Run Tests'
        steps:
          - checkout: self

          - task: UseDotNet@2
            inputs:
              useGlobalJson: true

          - script: dotnet restore apps/sample-api/SampleApi.sln
            displayName: 'Restore'

          - script: dotnet build apps/sample-api/SampleApi.sln --no-restore
            displayName: 'Build'

          - script: dotnet test apps/sample-api/SampleApi.sln --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"
            displayName: 'Test'

          - task: PublishTestResults@2
            inputs:
              testResultsFormat: 'VSTest'
              testResultsFiles: '**/*.trx'
            condition: always()

  # ─── Build Stage ─────────────────────────────────────────────────────────
  - stage: Build
    displayName: 'Build'
    dependsOn: Test
    jobs:
      - job: Build
        displayName: 'Publish'
        steps:
          - checkout: self

          - task: UseDotNet@2
            inputs:
              useGlobalJson: true

          - script: dotnet restore apps/sample-api/SampleApi.sln
            displayName: 'Restore'

          - script: dotnet publish apps/sample-api/SampleApi.csproj -c Release -o publish --no-restore
            displayName: 'Publish'

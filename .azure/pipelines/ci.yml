# Azure DevOps — CI Pipeline
#
# Runs on every push and pull request to main.
# Lints, tests, and builds each application in the monorepo in parallel jobs.
#
# Add new apps:
#   1. Add a job to the "CI" stage below following the existing pattern
#   2. Add the app's path to the trigger/pr path filters if you use them
#
# Docs: https://learn.microsoft.com/en-us/azure/devops/pipelines/

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  CI: 'true'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  # TODO: Add project-specific variables

stages:
  - stage: CI
    displayName: 'Lint, Test & Build'
    jobs:
      # ─── sample-api (.NET) ───────────────────────────────────────────────
      - job: SampleApi
        displayName: 'sample-api'
        variables:
          appDir: 'apps/sample-api'
        steps:
          - checkout: self

          - task: UseDotNet@2
            displayName: 'Install .NET SDK'
            inputs:
              useGlobalJson: true

          - script: dotnet restore
            displayName: 'Restore'
            workingDirectory: $(appDir)

          - script: dotnet format SampleApi.slnx --verify-no-changes --verbosity normal
            displayName: 'Check formatting'
            workingDirectory: $(appDir)

          - script: dotnet build --no-restore -c Release
            displayName: 'Build'
            workingDirectory: $(appDir)

          - script: dotnet test --no-build -c Release --verbosity normal --logger "trx;LogFileName=test-results.trx"
            displayName: 'Test'
            workingDirectory: $(appDir)

          - task: PublishTestResults@2
            displayName: 'Publish test results'
            condition: always()
            inputs:
              testResultsFormat: 'VSTest'
              testResultsFiles: '$(appDir)/**/TestResults/*.trx'

          - script: dotnet publish SampleApi.csproj -c Release -o $(Build.ArtifactStagingDirectory)/sample-api --no-build
            displayName: 'Publish'
            workingDirectory: $(appDir)

          - publish: $(Build.ArtifactStagingDirectory)/sample-api
            artifact: sample-api
            displayName: 'Upload artifact'

      # ─── sample-web (React/Vite) ─────────────────────────────────────────
      - job: SampleWeb
        displayName: 'sample-web'
        variables:
          appDir: 'apps/sample-web'
        steps:
          - checkout: self

          - task: NodeTool@0
            displayName: 'Install Node.js'
            inputs:
              versionSpec: '22.x'

          - script: npm ci
            displayName: 'Install dependencies'
            workingDirectory: $(appDir)

          - script: npm run lint
            displayName: 'Lint'
            workingDirectory: $(appDir)

          - script: npm run type-check
            displayName: 'Type check'
            workingDirectory: $(appDir)

          - script: npm test
            displayName: 'Test'
            workingDirectory: $(appDir)

          - script: npm run build
            displayName: 'Build'
            workingDirectory: $(appDir)

          - publish: $(appDir)/dist
            artifact: sample-web
            displayName: 'Upload artifact'

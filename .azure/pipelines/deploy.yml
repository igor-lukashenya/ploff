trigger: none  # Manual trigger or called from CI

parameters:
  - name: environment
    displayName: 'Target Environment'
    type: string
    default: dev
    values:
      - dev
      - staging
      - production

  - name: app
    displayName: 'Application to deploy'
    type: string
    default: all

pool:
  vmImage: 'ubuntu-latest'


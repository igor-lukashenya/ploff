# GitHub Actions - Security
#
# CodeQL static analysis (C#, TypeScript/JavaScript) on pull requests, main and
# weekly, plus a weekly vulnerability scan: new CVEs are published for
# dependencies that haven't changed, so a green PR today can be vulnerable next week.
# Secret and vulnerability scans of each change run in CI (ci.yml, "CI Gate").
#
# CodeQL results appear under Security → Code scanning. Code scanning is free for
# public repositories; private repositories need GitHub Code Security, so CodeQL
# only runs there when the repository variable ENABLE_CODEQL is 'true'.
# See docs/guides/security.md.

name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    if: ${{ !github.event.repository.private || vars.ENABLE_CODEQL == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload results to code scanning
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # build-mode none: no build needed (C# is analyzed from source)
        language: [csharp, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}

  scheduled-vulnerabilities:
    name: weekly vulnerability scan
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install scanners
        run: |
          bash tools/scripts/install-scanners.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Scan dependencies and IaC
        run: bash tools/scripts/scan-security.sh vulns

# GitHub Actions - Release Please
#
# Automates versioning, changelogs, and GitHub Releases per app.
# Creates separate Release PRs for each app based on Conventional Commits.
#
# Flow:
#   1. Commits land on main with conventional format: feat(sample-api): ...
#   2. Release Please opens/updates a Release PR per affected app
#   3. PR bumps the version (see extra-files in release-please-config.json),
#      updates the app's CHANGELOG.md
#   4. Merging the Release PR creates a git tag (e.g., sample-api/v1.2.0)
#   5. Every released app is deployed to production via deploy-app.yml
#
# Apps are registered in release-please-config.json (done by `make new-app`);
# no changes to this file are needed when adding apps.
#
# Token: set the optional RELEASE_PLEASE_TOKEN secret (GitHub App token or
# fine-grained PAT with contents + pull-requests write). Pushes made with the
# default GITHUB_TOKEN don't trigger other workflows, so without it release PRs
# get no CI run until you trigger one (e.g. close and reopen the PR).
# See docs/guides/release-process.md.

name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.releases.outputs.releases }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Build [{ "app": "sample-api", "version": "1.2.0" }, ...] for released paths
      - name: Collect released apps
        id: releases
        env:
          OUTPUTS: ${{ toJSON(steps.release.outputs) }}
        run: |
          RELEASES=$(echo "$OUTPUTS" | jq -c '
            . as $o
            | (($o.paths_released // "[]") | fromjson)
            | map(select(startswith("apps/")))
            | map({ app: ltrimstr("apps/"), version: $o[. + "--version"] })')
          echo "Released: $RELEASES"
          echo "releases=$RELEASES" >> "$GITHUB_OUTPUT"

  # After a release, the other open release PRs conflict on the shared
  # .release-please-manifest.json; merge main into them and resolve it.
  refresh-release-prs:
    name: Refresh other release PRs
    needs: release-please
    if: needs.release-please.outputs.releases != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      - name: Merge main into open release PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCHES=$(gh pr list --state open --base main --label "autorelease: pending" \
            --json headRefName --jq '.[].headRefName | select(startswith("release-please--"))')
          # shellcheck disable=SC2086 # one argument per branch
          bash tools/scripts/refresh-release-prs.sh $BRANCHES

  deploy:
    name: Deploy ${{ matrix.release.app }} v${{ matrix.release.version }}
    needs: release-please
    if: needs.release-please.outputs.releases != '[]'
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.release-please.outputs.releases) }}
    uses: ./.github/workflows/deploy-app.yml
    with:
      app: ${{ matrix.release.app }}
      version: ${{ matrix.release.version }}
      environment: production
    secrets: inherit

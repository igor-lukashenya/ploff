# GitHub Actions - CI Pipeline
#
# Runs on every push and pull request to main.
#
# `moon ci` detects which projects are affected by the change (including projects
# that depend on a changed shared package) and runs their build/lint/typecheck/test
# tasks. Adding a new app or package requires NO changes to this file - only a
# moon.yml in the project (see docs/adr/003-monorepo-tooling.md).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # moon run report comment

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # ---- Apps & packages (all stacks) ----
  moon:
    name: moon ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history is required for affected-project detection
          fetch-depth: 0
          filter: 'blob:none'

      # .NET has no moon toolchain plugin; the SDK version comes from global.json
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Installs proto, moon and the tools pinned in .prototools (Node.js)
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      # --include-relations + --downstream deep: when a shared package changes,
      # also build/lint/test every project that depends on it (moon.yml dependsOn)
      - name: Run affected tasks
        run: |
          # moon fails in a workspace without projects (e.g. a new solution before
          # its first `make new-app`); nothing to check then
          if ! compgen -G "apps/*/moon.yml" > /dev/null && ! compgen -G "packages/*/moon.yml" > /dev/null; then
            echo "No moon projects yet - skipping."
            exit 0
          fi
          moon ci --include-relations --downstream deep

      # Dependabot updates the sample apps but can't see tools/generators/.
      # Non-blocking so Dependabot PRs stay mergeable; fix with `make sync-templates`.
      - name: Check generator templates
        if: success() || failure()
        run: |
          if ! bash tools/scripts/sync-templates.sh --check; then
            echo "::warning title=Generator templates out of sync::Run 'make sync-templates' and commit the result."
          fi

      - uses: moonrepo/run-report-action@bbe7e99bf2aca819ec660ec01fc59d84bdd492d6 # v1.10.0
        if: success() || failure()
        with:
          access-token: ${{ secrets.GITHUB_TOKEN }}

  # ---- Detect changes outside moon projects ----
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      templates: ${{ steps.filter.outputs.templates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            docs:
              - 'docs/**'
              - 'mkdocs.yml'
            templates:
              - 'tools/generators/**'
              - 'tools/scripts/new-project.sh'
              - 'tools/scripts/test-generators.sh'
              - 'tools/scripts/remove-samples.sh'
              - '.moon/**'
              - '.prototools'
              - 'global.json'
              - 'Directory.*.props'

  # ---- Docs: Build ----
  docs:
    name: docs
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install MkDocs
        run: pip install -r docs/requirements.txt

      - name: Build docs
        run: mkdocs build --strict

  # ---- Generators: create one project per stack and verify it ----
  templates:
    name: generator self-test
    needs: changes
    if: needs.changes.outputs.templates == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      - name: Generate and verify every stack
        run: bash tools/scripts/test-generators.sh --docker

  # ---- Security: secrets in the pushed commits ----
  # Scanners run as pinned, checksum-verified binaries (tools/scripts/install-scanners.sh)
  # in jobs without secrets - see docs/guides/security.md.
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install scanners
        run: |
          bash tools/scripts/install-scanners.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Scan commits for secrets
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            bash tools/scripts/scan-security.sh secrets --range "$PR_BASE..$PR_HEAD"
          elif [ -n "$PUSH_BEFORE" ] && ! [[ "$PUSH_BEFORE" =~ ^0+$ ]]; then
            bash tools/scripts/scan-security.sh secrets --range "$PUSH_BEFORE..$GITHUB_SHA"
          else
            bash tools/scripts/scan-security.sh secrets
          fi

  # ---- Security: vulnerable dependencies and IaC misconfigurations ----
  vulnerabilities:
    name: vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install scanners
        run: |
          bash tools/scripts/install-scanners.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Settings in trivy.yaml; accepted findings in .trivyignore
      - name: Scan dependencies and IaC
        run: bash tools/scripts/scan-security.sh vulns

  # ---- CI Gate (the single required status check) ----
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [moon, changes, docs, templates, secrets, vulnerabilities]
    steps:
      - name: Check results
        run: |
          fail=0
          for result in \
            "moon=${{ needs.moon.result }}" \
            "changes=${{ needs.changes.result }}" \
            "docs=${{ needs.docs.result }}" \
            "templates=${{ needs.templates.result }}" \
            "secrets=${{ needs.secrets.result }}" \
            "vulnerabilities=${{ needs.vulnerabilities.result }}"; do
            echo "$result"
            # skipped is fine (nothing affected); failure/cancelled is not
            if [[ "${result#*=}" =~ ^(failure|cancelled)$ ]]; then
              fail=1
            fi
          done
          exit $fail

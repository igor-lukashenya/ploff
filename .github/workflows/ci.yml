# GitHub Actions - CI Pipeline
#
# Runs on every push and pull request to main/develop.
# Uses change detection to only build/test affected apps.
#
# Add new apps:
#   1. Add path filter in the "changes" job
#   2. Add a new build/test job below
#   3. Add it to the ci-gate needs list

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # ---- Detect Changes ----
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      sample-api: ${{ steps.filter.outputs.sample-api }}
      sample-web: ${{ steps.filter.outputs.sample-web }}
      infra: ${{ steps.filter.outputs.infra }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            sample-api:
              - 'apps/sample-api/**'
              - 'packages/**'
            sample-web:
              - 'apps/sample-web/**'
              - 'packages/**'
            infra:
              - 'infra/**'
            docs:
              - 'docs/**'
              - 'mkdocs.yml'

  # ---- Sample API: Lint + Test + Build ----
  sample-api:
    name: "sample-api"
    needs: changes
    if: needs.changes.outputs.sample-api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sample-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Check formatting
        run: dotnet format --verify-no-changes --verbosity normal

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-sample-api
          path: apps/sample-api/**/TestResults/*.trx

  # ---- Sample Web: Lint + Test + Build ----
  sample-web:
    name: "sample-web"
    needs: changes
    if: needs.changes.outputs.sample-web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sample-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: apps/sample-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sample-web-dist
          path: apps/sample-web/dist
          retention-days: 7

  # ---- Docs: Build ----
  docs:
    name: "docs"
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install MkDocs
        run: pip install mkdocs-material

      - name: Build docs
        run: mkdocs build --strict

  # ---- CI Gate (required status check) ----
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [changes, sample-api, sample-web, docs]
    steps:
      - name: Check results
        run: |
          echo "Changes detected:"
          echo "  sample-api: ${{ needs.changes.outputs.sample-api }}"
          echo "  sample-web: ${{ needs.changes.outputs.sample-web }}"
          echo "  docs: ${{ needs.changes.outputs.docs }}"
          echo ""

          # Fail if any required job failed
          if [ "${{ needs.sample-api.result }}" = "failure" ]; then
            echo "sample-api CI failed!"
            exit 1
          fi

          if [ "${{ needs.sample-web.result }}" = "failure" ]; then
            echo "sample-web CI failed!"
            exit 1
          fi

          if [ "${{ needs.docs.result }}" = "failure" ]; then
            echo "docs CI failed!"
            exit 1
          fi

          echo "All checks passed!"

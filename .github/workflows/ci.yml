# GitHub Actions — CI Pipeline
#
# Runs on every push and pull request to main/develop.
# Builds and tests all applications in the monorepo.
#
# TODO: Customize for your specific apps and tech stack.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # TODO: Add global environment variables here
  CI: true

jobs:
  # ─── Detect Changes ────────────────────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # TODO: Add your apps here. Each key becomes a job matrix entry.
            # api:
            #   - 'apps/api/**'
            #   - 'packages/**'
            # web:
            #   - 'apps/web/**'
            #   - 'packages/**'
            infra:
              - 'infra/**'
            docs:
              - 'docs/**'

  # ─── Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4


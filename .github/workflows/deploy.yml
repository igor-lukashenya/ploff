# GitHub Actions — Deployment Pipeline
#
# Deploys applications to target environments.
# Triggered manually or after CI passes on main.
#
# TODO: Configure for your deployment target (VPS, Azure, AWS, K8s, etc.)

name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - staging
          - production
      app:
        description: 'Application to deploy (or "all")'
        required: true
        type: string
        default: all

  # Auto-deploy to dev on push to main (optional)
  # push:
  #   branches: [main]

env:
  # TODO: Configure registry and other deployment variables

# GitHub Actions - Deploy to Dev
#
# Auto-deploys every affected deployable app to the dev environment on each merge
# to main. moon computes the affected projects for the pushed commit range,
# including apps that depend on a changed shared package. Apps opt in with the
# `deployable` tag in their moon.yml - no changes to this file are needed.

name: Deploy Dev

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  # ---- Detect which deployable apps are affected ----
  affected:
    name: Detect affected apps
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.query.outputs.apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: 'blob:none'

      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4

      - name: Query affected deployable apps
        id: query
        env:
          MOON_BASE: ${{ github.event.before }}
          MOON_HEAD: ${{ github.sha }}
        run: |
          APPS=$(moon query projects --affected --downstream deep --tags deployable \
            | jq -c '[.projects[].id]')
          echo "Affected deployable apps: $APPS"
          echo "apps=$APPS" >> "$GITHUB_OUTPUT"

  # ---- Deploy each affected app to dev ----
  deploy:
    name: Deploy ${{ matrix.app }} to dev
    needs: affected
    if: needs.affected.outputs.apps != '[]'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.affected.outputs.apps) }}
    uses: ./.github/workflows/deploy-app.yml
    with:
      app: ${{ matrix.app }}
      version: latest
      environment: dev
    secrets: inherit

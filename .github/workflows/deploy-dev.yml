# GitHub Actions - Deploy to Dev
#
# Auto-deploys all affected apps to the dev environment on every merge to main.
# Uses dorny/paths-filter to detect which apps changed.

name: Deploy Dev

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  # ---- Detect which apps changed ----
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      sample-api: ${{ steps.filter.outputs.sample-api }}
      sample-web: ${{ steps.filter.outputs.sample-web }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            sample-api:
              - 'apps/sample-api/**'
              - 'packages/**'
            sample-web:
              - 'apps/sample-web/**'
              - 'packages/**'

  # ---- Deploy affected apps to dev ----
  deploy-sample-api:
    name: Deploy sample-api to dev
    needs: changes
    if: needs.changes.outputs.sample-api == 'true'
    uses: ./.github/workflows/deploy-app.yml
    with:
      app: sample-api
      version: latest
      environment: dev
    secrets: inherit

  deploy-sample-web:
    name: Deploy sample-web to dev
    needs: changes
    if: needs.changes.outputs.sample-web == 'true'
    uses: ./.github/workflows/deploy-app.yml
    with:
      app: sample-web
      version: latest
      environment: dev
    secrets: inherit

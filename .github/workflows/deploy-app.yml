# GitHub Actions - Deploy App (Reusable Workflow)
#
# Reusable workflow that deploys a specific app to a specific environment.
# Called by:
#   - release-please.yml (after tagging a release -> production)
#   - deploy-dev.yml (auto-deploy on main merge)
#   - deploy-staging.yml (release branch -> staging)
#   - Manual dispatch (for ad-hoc deployments)
#
# Stack-agnostic: every deployable app exposes a moon `publish` task that writes
# its artifact to apps/<app>/dist (see .moon/tasks/ and each app's moon.yml).

name: Deploy App

on:
  workflow_call:
    inputs:
      app:
        description: 'Application to deploy (moon project ID)'
        required: true
        type: string
      version:
        description: 'Version being deployed'
        required: true
        type: string
      environment:
        description: 'Target environment'
        required: true
        type: string

  workflow_dispatch:
    inputs:
      app:
        description: 'Application to deploy (moon project ID, e.g. sample-api)'
        required: true
        type: string
      version:
        description: 'Version to deploy (e.g., 1.2.0 or "latest")'
        required: true
        type: string
        default: latest
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - staging
          - production

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # ---- Test + build the deployable artifact ----
  build:
    name: Build ${{ inputs.app }} v${{ inputs.version }}
    runs-on: ubuntu-latest
    env:
      APP: ${{ inputs.app }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Verify app is deployable
        run: |
          if ! moon query projects --tags deployable | jq -e --arg app "$APP" '.projects[] | select(.id == $app)' > /dev/null; then
            echo "::error::'$APP' is not a moon project tagged 'deployable'"
            exit 1
          fi

      - name: Test and publish
        run: moon run "$APP:test" "$APP:publish"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app }}-${{ inputs.version }}
          path: apps/${{ inputs.app }}/dist
          retention-days: 30

  # ---- Deploy to Target Environment ----
  deploy:
    name: Deploy ${{ inputs.app }} to ${{ inputs.environment }}
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.app }}-${{ inputs.version }}
          path: publish/${{ inputs.app }}

      - name: Deploy
        env:
          APP: ${{ inputs.app }}
          VERSION: ${{ inputs.version }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          echo "============================================"
          echo "Deploying $APP v$VERSION"
          echo "Environment: $ENVIRONMENT"
          echo "============================================"
          echo ""
          echo "TODO: Add your deployment commands here."
          echo ""
          echo "For services:"
          echo "  - Docker build + push to registry"
          echo "  - Azure Container Apps / App Service"
          echo "  - Kubernetes apply"
          echo ""
          echo "For frontend apps:"
          echo "  - Upload to CDN / static hosting"
          echo "  - Azure Static Web Apps"
          echo "  - Vercel / Netlify / Cloudflare Pages"
          echo ""
          echo "Artifact contents:"
          ls -la "publish/$APP/"

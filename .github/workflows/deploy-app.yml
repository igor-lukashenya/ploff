# GitHub Actions - Deploy App (Reusable Workflow)
#
# Reusable workflow that deploys a specific app to a specific environment.
# Called by:
#   - release-please.yml (after tagging a release -> production)
#   - deploy-dev.yml (auto-deploy on main merge)
#   - deploy-staging.yml (release branch -> staging)
#   - Manual dispatch (for ad-hoc deployments)
#
# Supports both .NET (sample-api) and Node.js (sample-web) apps.

name: Deploy App

on:
  workflow_call:
    inputs:
      app:
        description: 'Application to deploy'
        required: true
        type: string
      version:
        description: 'Version being deployed'
        required: true
        type: string
      environment:
        description: 'Target environment'
        required: true
        type: string

  workflow_dispatch:
    inputs:
      app:
        description: 'Application to deploy'
        required: true
        type: choice
        options:
          - sample-api
          - sample-web
      version:
        description: 'Version to deploy (e.g., 1.2.0 or "latest")'
        required: true
        type: string
        default: latest
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - staging
          - production

jobs:
  # ---- Build .NET app ----
  build-dotnet:
    name: Build ${{ inputs.app }} v${{ inputs.version }}
    if: inputs.app == 'sample-api'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore apps/${{ inputs.app }}

      - name: Build
        run: dotnet build apps/${{ inputs.app }} -c Release --no-restore

      - name: Test
        run: dotnet test apps/${{ inputs.app }} -c Release --no-build --verbosity normal

      - name: Publish
        run: dotnet publish apps/${{ inputs.app }} -c Release -o publish/${{ inputs.app }} --no-build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app }}-${{ inputs.version }}
          path: publish/${{ inputs.app }}
          retention-days: 30

  # ---- Build Node.js app ----
  build-node:
    name: Build ${{ inputs.app }} v${{ inputs.version }}
    if: inputs.app == 'sample-web'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: apps/${{ inputs.app }}/package-lock.json

      - name: Install dependencies
        run: cd apps/${{ inputs.app }} && npm ci

      - name: Lint
        run: cd apps/${{ inputs.app }} && npm run lint

      - name: Test
        run: cd apps/${{ inputs.app }} && npm test

      - name: Build
        run: cd apps/${{ inputs.app }} && npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app }}-${{ inputs.version }}
          path: apps/${{ inputs.app }}/dist
          retention-days: 30

  # ---- Deploy to Target Environment ----
  deploy:
    name: Deploy ${{ inputs.app }} to ${{ inputs.environment }}
    needs: [build-dotnet, build-node]
    if: always() && (needs.build-dotnet.result == 'success' || needs.build-node.result == 'success')
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.app }}-${{ inputs.version }}
          path: publish/${{ inputs.app }}

      - name: Deploy
        run: |
          echo "============================================"
          echo "Deploying ${{ inputs.app }} v${{ inputs.version }}"
          echo "Environment: ${{ inputs.environment }}"
          echo "============================================"
          echo ""
          echo "TODO: Add your deployment commands here."
          echo ""
          echo "For .NET apps:"
          echo "  - Docker build + push to registry"
          echo "  - Azure Container Apps / App Service"
          echo "  - Kubernetes apply"
          echo ""
          echo "For frontend apps:"
          echo "  - Upload to CDN / static hosting"
          echo "  - Azure Static Web Apps"
          echo "  - Vercel / Netlify / Cloudflare Pages"
          echo ""
          echo "Artifact contents:"
          ls -la publish/${{ inputs.app }}/

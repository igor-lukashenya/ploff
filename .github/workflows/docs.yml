# GitHub Actions — Deploy Documentation to GitHub Pages
#
# Builds MkDocs Material and deploys to GitHub Pages on push to main.
# Requires GitHub Pages to be enabled (Settings → Pages → Source: GitHub Actions).

name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  build:
    name: Build Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install MkDocs Material
        run: pip install -r docs/requirements.txt

      # Provides the Pages URL (including custom domains) for mkdocs.yml site_url
      - uses: actions/configure-pages@v6
        id: pages

      - name: Build documentation
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          REPO_NAME: ${{ github.repository }}
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:
    name: Deploy Docs
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

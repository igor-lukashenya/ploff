# Dependabot — Automated Dependency Updates
#
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
#
# Dependabot creates PRs to keep dependencies up to date.
# Customize the schedule and package ecosystems for your apps.

version: 2

updates:
  # ─── GitHub Actions ────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"

  # ─── Docker ────────────────────────────────────────────────────────────────
  - package-ecosystem: "docker"
    directory: "/infra/docker"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
    labels:
      - "dependencies"
      - "docker"

  # ─── Documentation (MkDocs) ────────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/docs"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "docs"
    labels:
      - "dependencies"
      - "documentation"

  # ─── Terraform ─────────────────────────────────────────────────────────────
  - package-ecosystem: "terraform"
    directories:
      - "/infra/terraform/environments/*"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "infra"
    labels:
      - "dependencies"
      - "infrastructure"

  # ─── Application Dependencies ──────────────────────────────────────────────
  # One entry per app. Commit prefix uses the app scope so Release Please
  # attributes dependency bumps to the right app.

  - package-ecosystem: "nuget"
    directory: "/apps/sample-api"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(sample-api)"
    labels:
      - "dependencies"
    groups:
      nuget-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/apps/sample-web"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(sample-web)"
    labels:
      - "dependencies"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  # new-project.sh inserts entries for new apps/packages above this line

  # Templates for other ecosystems:

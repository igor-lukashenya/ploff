# Dependabot — Automated Dependency Updates
#
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
#
# Dependabot creates PRs to keep dependencies up to date.
# Customize the schedule and package ecosystems for your apps.
#
# Update policy:
#   - GitHub Actions: all updates grouped into one weekly PR
#   - Minor/patch library updates: grouped per app
#   - Major library updates: one PR each - merge only when CI passes
#   - Runtimes (Node.js, .NET) are NOT upgraded by Dependabot: images and
#     @types/node ignore major versions (this also filters out preview tags such
#     as 11.0-preview). Upgrade a runtime deliberately in one PR, together with
#     .prototools, global.json, all Dockerfiles, tools/generators and @types/node.
#   - Dependabot does not see tools/generators/: after merging updates to a sample
#     app, run `make sync-templates` (CI shows a warning while templates drift).

version: 2

updates:
  # ─── GitHub Actions ────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"
    groups:
      github-actions:
        patterns: ["*"]

  # ─── Docker ────────────────────────────────────────────────────────────────
  - package-ecosystem: "docker"
    directory: "/infra/docker"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
    labels:
      - "dependencies"
      - "docker"
    ignore:
      # Runtime majors (and preview tags) are upgraded deliberately - see policy above
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ─── Documentation (MkDocs) ────────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/docs"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "docs"
    labels:
      - "dependencies"
      - "documentation"

  # ─── Terraform ─────────────────────────────────────────────────────────────
  - package-ecosystem: "terraform"
    directories:
      - "/infra/terraform/environments/*"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "infra"
    labels:
      - "dependencies"
      - "infrastructure"

  # ─── Application Dependencies ──────────────────────────────────────────────
  # One entry per app. Commit prefix uses the app scope so Release Please
  # attributes dependency bumps to the right app.

  - package-ecosystem: "nuget"
    directory: "/apps/sample-api"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(sample-api)"
    labels:
      - "dependencies"
    groups:
      nuget-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/apps/sample-web"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(sample-web)"
    labels:
      - "dependencies"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Must match the Node.js runtime in .prototools - see policy above
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # new-project.sh inserts entries for new apps/packages above this line

  # Templates for other ecosystems:
  #
  # Node.js (npm/yarn/pnpm):
  # - package-ecosystem: "npm"
  #   directory: "/apps/api"
  #   schedule:
  #     interval: "weekly"
  #   commit-message:
  #     prefix: "deps(api)"
  #   labels:
  #     - "dependencies"

# Docker Compose - Local Development
#
# Start:  make up    Stop: make down    Logs: make logs
#
# This base file holds shared infrastructure (databases, caches, brokers).
# Each app has its own fragment, compose.<app>.yml, created by `make new-app`.
# The Makefile loads this file plus every compose.*.yml fragment, so adding an
# app never requires editing this file. Equivalent manual command:
#
#   docker compose -f infra/docker/docker-compose.yml \
#     $(for f in infra/docker/compose.*.yml; do printf -- '-f %s ' "$f"; done) up -d

services: {}

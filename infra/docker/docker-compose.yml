# Docker Compose - Local Development
#
# Start:  make up   (or: docker compose -f infra/docker/docker-compose.yml up -d)
# Stop:   make down (or: docker compose -f infra/docker/docker-compose.yml down)
# Logs:   make logs

services:
  # ---- Sample API (.NET) ----
  sample-api:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.sample-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---- Sample Web (React/Vite) ----
  sample-web:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.sample-web
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://sample-api:8080
    depends_on:
      sample-api:
        condition: service_healthy

